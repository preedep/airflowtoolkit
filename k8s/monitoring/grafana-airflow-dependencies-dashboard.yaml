            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  operator as \"Operator Type\",\n  COUNT(*) as \"Usage Count\"\nFROM task_instance \nWHERE start_date >= $__timeFrom()\n  AND start_date <= $__timeTo()\n  AND operator IS NOT NULL\nGROUP BY operator\nORDER BY \"Usage Count\" DESC\nLIMIT 15;",
              "refId": "A"
            }
          ],
          "title": "Task Operator Distribution (7 days)",
          "type": "barchart"
        },
