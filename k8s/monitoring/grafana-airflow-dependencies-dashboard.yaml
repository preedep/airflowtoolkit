          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  COALESCE(tags::text, 'No Tags') as metric,\n  COUNT(*) as value\nFROM dag \nWHERE bundle_name IS NOT NULL\nGROUP BY tags::text\nORDER BY value DESC\nLIMIT 10;",
              "refId": "A"
            }
