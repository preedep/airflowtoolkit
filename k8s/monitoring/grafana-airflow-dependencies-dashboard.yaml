          "title": "DAGs by Tags",
          "type": "piechart"
        },
        {
          "datasource": "Airflow PostgreSQL",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Avg Duration (s)"
                },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "gradient-gauge"
                  },
                  {
                    "id": "max",
                    "value": 3600
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "id": 11,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Execution Count"
              }
            ]
          },
          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  dag_id as \"DAG ID\",\n  task_id as \"Task ID\",\n  operator as \"Operator\",\n  COUNT(*) as \"Execution Count\",\n  COUNT(CASE WHEN state = 'success' THEN 1 END) as \"Success\",\n  COUNT(CASE WHEN state = 'failed' THEN 1 END) as \"Failed\",\n  ROUND(AVG(EXTRACT(EPOCH FROM (end_date - start_date)))::numeric, 2) as \"Avg Duration (s)\"\nFROM task_instance \nWHERE start_date >= $__timeFrom()\n  AND start_date <= $__timeTo()\n  AND end_date IS NOT NULL\nGROUP BY dag_id, task_id, operator\nORDER BY \"Execution Count\" DESC\nLIMIT 50;",
              "refId": "A"
            }
          ],
          "title": "Task Execution Summary (7 days)",
          "type": "table"
        },
        {
          "datasource": "Airflow PostgreSQL",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "id": 12,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Event Count"
              }
            ]
          },
          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  a.uri as \"Asset URI\",\n  a.name as \"Asset Name\",\n  COUNT(ae.id) as \"Event Count\",\n  MAX(ae.timestamp) as \"Last Updated\"\nFROM asset a\nLEFT JOIN asset_event ae ON a.id = ae.asset_id\nWHERE (ae.timestamp >= $__timeFrom() AND ae.timestamp <= $__timeTo()) OR ae.timestamp IS NULL\nGROUP BY a.uri, a.name\nORDER BY \"Event Count\" DESC NULLS LAST\nLIMIT 30;",
              "refId": "A"
            }
          ],
          "title": "Asset Activity (7 days)",
          "type": "table"
        }
