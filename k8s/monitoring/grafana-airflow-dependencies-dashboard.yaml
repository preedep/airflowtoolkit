            "w": 12,
            "x": 0,
            "y": 20
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": ["sum", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
