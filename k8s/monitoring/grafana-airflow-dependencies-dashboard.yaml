          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  dag_id as \"DAG ID\",\n  COUNT(DISTINCT task_id) as \"Task Count\",\n  is_paused as \"Paused\",\n  schedule_interval as \"Schedule\",\n  tags::text as \"Tags\"\nFROM dag d\nLEFT JOIN (\n  SELECT DISTINCT dag_id, task_id \n  FROM task_instance \n  WHERE start_date >= $__timeFrom()\n    AND start_date <= $__timeTo()\n) ti ON d.dag_id = ti.dag_id\nWHERE d.bundle_name IS NOT NULL\nGROUP BY d.dag_id, d.is_paused, d.schedule_interval, d.tags\nORDER BY \"Task Count\" DESC\nLIMIT 20;",
              "refId": "A"
            }
          ],
          "title": "DAG Complexity (by Task Count)",
          "type": "table"
        },
        {
          "datasource": "Airflow PostgreSQL",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
