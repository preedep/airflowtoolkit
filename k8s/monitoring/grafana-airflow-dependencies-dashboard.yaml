            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  a.id as \"Asset ID\",\n  a.uri as \"URI\",\n  a.name as \"Name\",\n  a.group as \"Group\",\n  a.created_at as \"Created At\",\n  a.updated_at as \"Updated At\"\nFROM asset a\nORDER BY a.updated_at DESC NULLS LAST\nLIMIT 20;",
              "refId": "A"
            }
          ],
          "title": "Asset Registry",
          "type": "table"
        },
        {
          "datasource": "Airflow PostgreSQL",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
