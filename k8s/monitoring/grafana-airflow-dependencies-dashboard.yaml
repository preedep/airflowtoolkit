            {
              "datasource": "Airflow PostgreSQL",
              "format": "table",
              "rawSql": "SELECT \n  dsar.dag_id as \"DAG ID\",\n  a.uri as \"Asset URI\",\n  a.name as \"Asset Name\",\n  dsar.created_at as \"Created At\"\nFROM dag_schedule_asset_reference dsar\nJOIN asset a ON dsar.asset_id = a.id\nORDER BY dsar.dag_id, a.uri\nLIMIT 50;",
              "refId": "A"
            }
          ],
          "title": "DAG Asset Dependencies",
          "type": "table"
