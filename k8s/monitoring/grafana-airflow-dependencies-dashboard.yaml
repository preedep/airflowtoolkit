          },
          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "time_series",
              "rawSql": "SELECT \n  DATE_TRUNC('hour', ae.timestamp) as time,\n  a.uri as metric,\n  COUNT(*) as value\nFROM asset_event ae\nJOIN asset a ON ae.asset_id = a.id\nWHERE ae.timestamp >= $__timeFrom()\n  AND ae.timestamp <= $__timeTo()\nGROUP BY DATE_TRUNC('hour', ae.timestamp), a.uri\nORDER BY time;",
              "refId": "A"
            }
          ],
          "title": "Asset Update Events (7 days)",
          "type": "timeseries"
