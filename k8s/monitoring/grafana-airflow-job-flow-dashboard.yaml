          "id": 8,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": "Airflow PostgreSQL",
              "format": "time_series",
              "rawSql": "SELECT \n  DATE_TRUNC('hour', start_date) as time,\n  dag_id as metric,\n  AVG(EXTRACT(EPOCH FROM (end_date - start_date))) as value\nFROM dag_run\nWHERE state = 'success'\n  AND start_date >= $__timeFrom()\n  AND start_date <= $__timeTo()\n  AND end_date IS NOT NULL\nGROUP BY DATE_TRUNC('hour', start_date), dag_id\nORDER BY time;",
              "refId": "A"
            }
          ],
          "title": "DAG Duration Trend (Detect Performance Degradation)",
          "type": "timeseries"
        }
