              "rawSql": "SELECT \n  dag_id as \"DAG ID\",\n  task_id as \"Task ID\",\n  COALESCE(pool, 'default_pool') as \"Pool\",\n  priority_weight as \"Priority Weight\",\n  state as \"State\",\n  queued_dttm as \"Queued Time\",\n  EXTRACT(EPOCH FROM (NOW() - queued_dttm)) as \"Wait Time (s)\"\nFROM task_instance \nWHERE state = 'queued'\nORDER BY priority_weight DESC, queued_dttm ASC\nLIMIT 50;",
