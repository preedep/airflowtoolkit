---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.2
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_INSTALL_PLUGINS
          value: ""
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboard-metrics
          mountPath: /var/lib/grafana/dashboards/airflow-metrics.json
          subPath: airflow-dashboard.json
        - name: grafana-dashboard-dags
          mountPath: /var/lib/grafana/dashboards/airflow-dags.json
          subPath: airflow-db-dashboard.json
        - name: grafana-dashboard-status
          mountPath: /var/lib/grafana/dashboards/airflow-status.json
          subPath: airflow-status-dashboard.json
        - name: grafana-dashboard-task-performance
          mountPath: /var/lib/grafana/dashboards/airflow-task-performance.json
          subPath: airflow-task-performance-dashboard.json
        - name: grafana-dashboard-resource-pool
          mountPath: /var/lib/grafana/dashboards/airflow-resource-pool.json
          subPath: airflow-resource-pool-dashboard.json
        - name: grafana-dashboard-error-debug
          mountPath: /var/lib/grafana/dashboards/airflow-error-debug.json
          subPath: airflow-error-debug-dashboard.json
        - name: grafana-dashboard-dependencies
          mountPath: /var/lib/grafana/dashboards/airflow-dependencies.json
          subPath: airflow-dependencies-dashboard.json
        - name: grafana-dashboard-dag-tasks
          mountPath: /var/lib/grafana/dashboards/airflow-dag-tasks.json
          subPath: airflow-dag-tasks-dashboard.json
        - name: grafana-dashboard-job-flow
          mountPath: /var/lib/grafana/dashboards/airflow-job-flow.json
          subPath: airflow-job-flow-dashboard.json
        - name: grafana-dashboard-sla-baseline
          mountPath: /var/lib/grafana/dashboards/airflow-sla-baseline-dashboard.json
          subPath: airflow-sla-baseline-dashboard.json
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboard-metrics
        configMap:
          name: grafana-airflow-dashboard
      - name: grafana-dashboard-dags
        configMap:
          name: grafana-airflow-db-dashboard
      - name: grafana-dashboard-status
        configMap:
          name: grafana-airflow-status-dashboard
      - name: grafana-dashboard-task-performance
        configMap:
          name: grafana-airflow-task-performance-dashboard
      - name: grafana-dashboard-resource-pool
        configMap:
          name: grafana-airflow-resource-pool-dashboard
      - name: grafana-dashboard-error-debug
        configMap:
          name: grafana-airflow-error-debug-dashboard
      - name: grafana-dashboard-dependencies
        configMap:
          name: grafana-airflow-dependencies-dashboard
      - name: grafana-dashboard-dag-tasks
        configMap:
          name: grafana-airflow-dag-tasks-dashboard
      - name: grafana-dashboard-job-flow
        configMap:
          name: grafana-airflow-job-flow-dashboard
      - name: grafana-dashboard-sla-baseline
        configMap:
          name: grafana-airflow-sla-baseline-dashboard
