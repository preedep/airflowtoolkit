---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
      - name: Airflow PostgreSQL
        type: postgres
        access: proxy
        url: postgresql.database.svc.cluster.local:5432
        database: airflow
        user: airflow
        secureJsonData:
          password: airflow123
        jsonData:
          sslmode: disable
          postgresVersion: 1400
        editable: true
      - name: Airflow Extension
        type: postgres
        access: proxy
        url: postgresql.database.svc.cluster.local:5432
        database: airflow_extension
        user: airflow
        secureJsonData:
          password: airflow123
        jsonData:
          sslmode: disable
          postgresVersion: 1400
        editable: true
