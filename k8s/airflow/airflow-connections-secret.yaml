---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
  namespace: airflow
  labels:
    app: airflow
    component: connections
type: Opaque
stringData:
  # Airflow Metadata Connection (same PostgreSQL instance, airflow database)
  AIRFLOW_CONN_AIRFLOW_METADATA: "postgresql://airflow:airflow123@postgresql.database.svc.cluster.local:5432/airflow"
  
  # Airflow Extension Connection (same PostgreSQL instance, airflow_extension database)
  AIRFLOW_CONN_AIRFLOW_EXTENSION: "postgresql://airflow:airflow123@postgresql.database.svc.cluster.local:5432/airflow_extension"
