---
# Patch for scheduler to mount DAGs ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  template:
    spec:
      containers:
      - name: scheduler
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
          readOnly: true
      volumes:
      - name: dags
        configMap:
          name: airflow-dags
---
# Patch for dag-processor to mount DAGs ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: airflow
spec:
  template:
    spec:
      containers:
      - name: dag-processor
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
          readOnly: true
      volumes:
      - name: dags
        configMap:
          name: airflow-dags
---
# Patch for triggerer to mount DAGs ConfigMap
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-triggerer
  namespace: airflow
spec:
  template:
    spec:
      containers:
      - name: triggerer
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
          readOnly: true
      volumes:
      - name: dags
        configMap:
          name: airflow-dags
